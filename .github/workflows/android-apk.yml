name: Android App bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "admin.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "css/**"
      - "js/**"
      - "icons/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug-APK bauen (zum Direkt-Installieren)
        run: gradle -p android assembleDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: standort-analyse-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signierter Release-Build (APK + AAB für den Play Store) – nur wenn
      # ein Keystore als Repository-Secret hinterlegt ist.
      - name: Keystore aus Secret schreiben
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Release-APK & AAB bauen (signiert)
        if: ${{ steps.keystore.outputs.path != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease

      - name: Release-Artefakte hochladen
        if: ${{ steps.keystore.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: standort-analyse-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
