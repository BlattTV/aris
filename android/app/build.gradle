plugins {
    id 'com.android.application'
}

android {
    namespace 'de.standortanalyse.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.standortanalyse.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
